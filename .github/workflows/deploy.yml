name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Evita builds redundantes para el mismo ref: cancela el anterior en la misma
# rama y deja solo el ultimo (mismo patron que veltylabs/misitio).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # TinyGo lo instala el mismo paquete que usa sitec durante el build, asi
      # que la version sale de un solo lugar: DefaultVersion de
      # github.com/tinywasm/tinygo, clavada por la version del modulo en go.mod.
      # Ver veltylabs/misitio/.github/workflows/deploy.yml para el razonamiento
      # completo de por que este paso vive aparte del build de sitec.
      - name: Set up TinyGo
        run: echo "$(go run github.com/tinywasm/tinygo/cmd/tinygoinstall -v -print-bindir)" >> "$GITHUB_PATH"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./tests/...

      - name: Build with goflare
        run: go run github.com/tinywasm/goflare/cmd/goflare build

      # Worker API puro, sin PublicDir/assets: Deploy() toma el camino simple
      # (script + binding D1, sin el protocolo de asset-manifest-por-hash) —
      # ver ARCHITECTURE.md para por que esto no necesita wrangler, a
      # diferencia de un despliegue con assets estaticos.
      - name: Deploy with goflare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          PROJECT_NAME: iam
          WORKER_NAME: iam
          DOMAIN: iam.velty.cl
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: DB
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: go run github.com/tinywasm/goflare/cmd/goflare deploy

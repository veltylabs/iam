name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Evita builds redundantes para el mismo ref: cancela el anterior en la misma
# rama y deja solo el ultimo (mismo patron que veltylabs/misitio).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Los secretos van a nivel de job, no en el paso. Una action compuesta
    # hereda el entorno del job de forma fiable; el `env:` del paso que la
    # invoca no siempre llega a sus pasos internos.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WASM_MAX_SIZE_KIB: 2048

    steps:
      - uses: actions/checkout@v4

      # Un solo paso reemplaza a los seis anteriores. La action descarga el
      # binario de goflare publicado (antes se compilaban 15 MB en el runner),
      # instala TinyGo desde ese mismo binario —una sola fuente de la version—
      # y corre vet, tests, build, la migracion del esquema y el deploy.
      #
      # Solo despliega en push a main: en un pull request compila y prueba, que
      # es justo lo que se quiere revisar antes de mezclar.
      - uses: webtyp/goflare@v1
        with:
          worker: iam
          domain: iam.velty.cl
          d1-binding: DB
          d1-name: velty-iam-db
          test: './tests/...'
          pre-deploy: 'go run ./cmd/migrate'
          deploy: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
